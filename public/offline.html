<!doctype html>

<style>

    background: #0A1426;

    background-size: 26px 26px;
    color: #E4EAF3;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  .wrap { max-width: 26rem; }

  p { margin-top: 14px; font-size: 0.9rem; line-height: 1.6; color: #9CB2CF; }
  button {
    margin-top: 28px;
    background: #C09A2F;
    color: #0A1426;
    border: 0;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 0.9rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: #D2AC42; }
